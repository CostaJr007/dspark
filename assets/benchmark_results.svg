<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="barOnk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#238636;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barOn2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#da3633;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="16" />

  <text x="450" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">
    Pivot Tournament Scaling: O(Nk) vs O(N²) API Call Comparisons
  </text>

  <!-- Legend -->
  <rect x="280" y="70" width="18" height="18" rx="4" fill="url(#barOnk)" />
  <text x="310" y="85" font-family="sans-serif" font-size="13" fill="#c9d1d9">DSpark PPT O(Nk) [k=3]</text>

  <rect x="520" y="70" width="18" height="18" rx="4" fill="url(#barOn2)" />
  <text x="550" y="85" font-family="sans-serif" font-size="13" fill="#c9d1d9">Naive All-Pairs O(N²)</text>

  <!-- Chart Area -->
  <g transform="translate(80, 120)">
    <!-- Grid Lines -->
    <line x1="0" y1="200" x2="740" y2="200" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="150" x2="740" y2="150" stroke="#21262d" stroke-width="1"/>
    <line x1="0" y1="100" x2="740" y2="100" stroke="#21262d" stroke-width="1"/>
    <line x1="0" y1="50" x2="740" y2="50" stroke="#21262d" stroke-width="1"/>
    <line x1="0" y1="0" x2="740" y2="0" stroke="#21262d" stroke-width="1"/>

    <!-- Y-Axis labels -->
    <text x="-15" y="205" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="end">0</text>
    <text x="-15" y="155" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="end">1,250</text>
    <text x="-15" y="105" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="end">2,500</text>
    <text x="-15" y="55" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="end">3,750</text>
    <text x="-15" y="5" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="end">5,000</text>

    <!-- Group 1: N=10 -->
    <g transform="translate(60, 0)">
      <rect x="0" y="198" width="36" height="2" fill="url(#barOnk)" rx="2"/>
      <text x="18" y="190" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">34</text>
      
      <rect x="44" y="198" width="36" height="2" fill="url(#barOn2)" rx="2"/>
      <text x="62" y="190" font-family="sans-serif" font-size="11" fill="#ff7b72" text-anchor="middle">45</text>
      
      <text x="40" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9" text-anchor="middle">N=10</text>
      <text x="40" y="245" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">-24%</text>
    </g>

    <!-- Group 2: N=20 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="197" width="36" height="3" fill="url(#barOnk)" rx="2"/>
      <text x="18" y="188" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">74</text>
      
      <rect x="44" y="192" width="36" height="8" fill="url(#barOn2)" rx="2"/>
      <text x="62" y="184" font-family="sans-serif" font-size="11" fill="#ff7b72" text-anchor="middle">190</text>
      
      <text x="40" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9" text-anchor="middle">N=20</text>
      <text x="40" y="245" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">-61%</text>
    </g>

    <!-- Group 3: N=50 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="192" width="36" height="8" fill="url(#barOnk)" rx="2"/>
      <text x="18" y="184" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">184</text>
      
      <rect x="44" y="151" width="36" height="49" fill="url(#barOn2)" rx="2"/>
      <text x="62" y="143" font-family="sans-serif" font-size="11" fill="#ff7b72" text-anchor="middle">1,225</text>
      
      <text x="40" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9" text-anchor="middle">N=50</text>
      <text x="40" y="245" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">-85%</text>
    </g>

    <!-- Group 4: N=100 -->
    <g transform="translate(600, 0)">
      <rect x="0" y="185" width="36" height="15" fill="url(#barOnk)" rx="2"/>
      <text x="18" y="177" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">359</text>
      
      <rect x="44" y="2" width="36" height="198" fill="url(#barOn2)" rx="2"/>
      <text x="62" y="-6" font-family="sans-serif" font-size="11" fill="#ff7b72" text-anchor="middle">4,950</text>
      
      <text x="40" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9" text-anchor="middle">N=100</text>
      <text x="40" y="245" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">-92.7%</text>
    </g>
  </g>
</svg>
