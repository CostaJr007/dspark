<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" rx="16" fill="#0d1117" />
  
  <!-- Spark Icon -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <path d="M 50 10 L 65 45 L 100 50 L 65 75 L 75 110 L 50 85 L 25 110 L 35 75 L 0 50 L 35 45 Z" fill="url(#grad1)" />
    <circle cx="50" cy="60" r="14" fill="#ffffff" opacity="0.9" />
  </g>
  
  <!-- Logo Text -->
  <text x="190" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    D<tspan fill="url(#grad1)">Spark</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="192" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#8b949e" letter-spacing="0.5">
    Agent-Level Speculative Orchestration &amp; Dual-Engine Verification
  </text>
</svg>
