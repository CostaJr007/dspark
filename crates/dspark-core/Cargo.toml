[package]
name = "dspark-core"
version = "0.1.0"
edition = "2021"
authors = ["Adeilson Costa <costajr007@users.noreply.github.com>"]
description = "DSpark Core: dual-engine creator/curator with I/O arbitration and MCP verifier"
license = "MIT"
repository = "https://github.com/CostaJr007/dspark"
readme = "../../README.md"
keywords = ["ai", "deepseek", "gemini", "agent", "cli", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dspark"
path = "src/lib.rs"

[[bin]]
name = "dspark"
path = "src/main.rs"

[features]
default = ["regex-ast"]
regex-ast = []
tree-sitter-ast = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
regex = "1.10"
urlencoding = "2.1"
thiserror = "1.0"
dirs = "5.0"
toml = "0.8"
rayon = "1.10"
petgraph = "0.6"
statrs = "0.17"
ordered-float = "4.2"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "pivot_tournament"
harness = false

[[bench]]
name = "ast_resolver"
harness = false

[[bench]]
name = "speculative_pipeline"
harness = false