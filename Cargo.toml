[package]
name = "dspark-cli"
version = "0.1.0"
edition = "2021"
authors = ["Adeilson Costa <costajr007@users.noreply.github.com>"]
description = "⚡ DSpark: Dual-LLM Speculative Engine & Autonomous Agent CLI (Grok-Build + Kimi WebSearch + DeepSeek Verifier)"
license = "MIT"
repository = "https://github.com/CostaJr007/dspark"
readme = "README.md"
keywords = ["ai", "deepseek", "gemini", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dspark"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
regex = "1.10"
urlencoding = "2.1"
thiserror = "1.0"
dirs = "5.0"
