[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dspark-ai"
version = "0.1.0"
description = "Optional Python SDK for DSpark. The primary CLI is the Rust binary (cargo install --path .)."
readme = "README.md"
authors = [{ name = "Adeilson Costa", email = "costajr007@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=22.0.0"]

[project.urls]
Homepage = "https://github.com/CostaJr007/dspark"
Issues = "https://github.com/CostaJr007/dspark/issues"
Repository = "https://github.com/CostaJr007/dspark.git"
