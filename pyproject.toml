[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dspark-ai"
version = "0.2.0"
description = "Dual-Engine CEGAR & Adversarial Verification Platform for AI Coding Agents."
readme = "README.md"
authors = [{ name = "Adeilson Costa", email = "costajr007@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.0.0",
    "mcp>=1.0.0",
    "pytest>=7.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=22.0.0", "mypy>=1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.scripts]
dspark-mcp = "dspark.mcp.server:run_mcp_server"

[project.urls]
Homepage = "https://github.com/CostaJr007/dspark"
Issues = "https://github.com/CostaJr007/dspark/issues"
Repository = "https://github.com/CostaJr007/dspark.git"
