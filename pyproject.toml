[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dspark-ai"
version = "0.1.0"
description = "Dual-LLM Speculative Engine: High-Throughput Generation (Gemini) + Deep Reasoning I/O Arbitration (DeepSeek)"
readme = "README.md"
authors = [{ name = "Adeilton Costa Jr", email = "adeilton@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=22.0.0"]

[project.scripts]
dspark = "dspark.cli:main"

[project.urls]
Homepage = "https://github.com/CostaJr007/dspark"
Issues = "https://github.com/CostaJr007/dspark/issues"
Repository = "https://github.com/CostaJr007/dspark.git"
